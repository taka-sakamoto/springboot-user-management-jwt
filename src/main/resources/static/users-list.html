<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        h1 {
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 500px;
            background: white;
        }
        th, td {
            border: #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #eee;
        }
        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>ユーザー一覧</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メール</th>
        </tr>
    </thead>
    <tbody id="userTableBody">
    </tbody>
</table>

<a href="/">← トップへ戻る</a>

<script>
function loadUsers() {
    fetch("/api/users")
    .then(res => res.json())
    .then(users => {
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = "";

        users.forEach(user => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
            `;
            tbody.appendChild(row);
        });
    });
}

loadUsers();
</script>

</body>
</html>
