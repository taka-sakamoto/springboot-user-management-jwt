<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        h1 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            width: 250px;
            padding: 8px;
            font-size: 14px;
        }
        buttom {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            width: 350px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>ユーザー登録</h1>

<div class="form-group">
    <label>名前：</label><br>
    <input type=""text" id="name">
</div>

<div class="form-group">
    <label>メール：</label><br>
    <input type="text" id="email">
</div>

<button onclick="registerUser()">登録</button>

<div id="result"></div>

<a href="/">← トップへ戻る</a>

<script>
function registerUser() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    fetch(`/api/users?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`, {
    method: "POST"
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML =
        `<strong>登録成功：</strong><br>ID: ${data.id}<br>名前：${data.name}<br>メール: ${data.email}`;
    })
    .catch(err => {
        document.getElementById("result").innerHTML = "エラーが発生しました";
    })

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
}
</script>

</body>
</html>
